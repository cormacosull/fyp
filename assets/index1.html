<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <title>Avatar Viseme UI</title>
      <style>
         body {
         margin: 0;
         font-family: sans-serif;
         display: flex;
         height: 100vh;
         overflow: hidden;
         }
         #viewer {
         flex: 1;
         }
         #ui {
         width: 350px;
         background: #ddd;
         display: flex;
         flex-direction: column;
         justify-content: center;
         align-items: center;
         border-left: 5px solid #000000;
         }
         #ui h2 {
         font-size: 1.2em;
         margin-bottom: 10px;
         text-align: center;
         }
         #ui borderThing {
         border-bottom: 3px dotted #000000;
         width: 90%;
         margin: 10px 0;
         }
         #ui textarea {
         resize: none;
         text-align: center;
         width: 90%;
         height: 100px;
         border-radius: 2px;
         font-size: 1rem;
         margin-bottom: 10px;
         }
         #ui #resultOutput {
         resize: none;
         text-align: center;
         width: 90%;
         height: 200px;
         border-radius: 2px;
         font-size: 1rem;
         margin-bottom: 10px;
         }
         #ui button {
         resize: none;
         width: 90%;
         padding: 3px;
         border: 2px solid #000000;
         border-radius: 2px;
         background-color: #999;
         font-size: 1rem;
         margin-bottom: 10px;
         cursor: pointer;
         }
      </style>
      <script type="importmap">
         {
           "imports": {
             "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
             "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
           }
         }
      </script>
   </head>
   <body>
      <div id="viewer"></div>
      <div id="ui">
         <label style="margin-bottom: 5px;">
         <input type="radio" name="audioMode" value="tts" checked />
         Synthesised Audio
         </label>
         <label style="margin-bottom: 10px;">
         <input type="radio" name="audioMode" value="wav" />
         Upload WAV
         </label>
         <!-- WAV MODE -->
         <div id="wavInputs" style="display: none;">
            <input
               type="file"
               id="wavInput"
               accept=".wav"
               style="width: 90%; margin-bottom: 10px;"
               />
         </div>
         <!-- TTS MODE -->
         <div id="ttsInputs">
            <h2>Cuir isteach abairt as Gaelainn</h2>
            <textarea
               id="sentenceInput"
               placeholder="Scríobh do abairt anseo...">
    </textarea>
         </div>
         <button onclick="submitText()">Seol</button>
         <borderthing></borderthing>
         <textarea
            id="resultOutput"
            readonly
            placeholder="transcription will appear here...">
  </textarea>
         <audio
            id="ttsAudio"
            controls
            style="width: 100%; margin-top: 10px;">
         </audio>
      </div>
      <script type="module">
         import * as THREE from 'three';
         import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
         import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
         
         const MODEL_URL = 'https://models.readyplayer.me/6910af3648062250a47e49c1.glb?morphTargets=Oculus%20Visemes';
         
         let scene, camera, renderer, controls;
         let meshesWithMorphs = [];
         let visemeNames = [];
         let currentVisemeIndex = 0;
         const VIS_DURATION = 2000;
         
         init();
         animate();
         function getAudioMode() {
         return document.querySelector('input[name="audioMode"]:checked').value;
         }
         function updateAudioModeUI() {
         const mode = document.querySelector('input[name="audioMode"]:checked').value;
         
         document.getElementById('wavInputs').style.display =
         mode === 'wav' ? 'block' : 'none';
         
         document.getElementById('ttsInputs').style.display =
         mode === 'tts' ? 'block' : 'none';
         }
         
         // Listen for radio changes
         document.querySelectorAll('input[name="audioMode"]').forEach(radio => {
         radio.addEventListener('change', updateAudioModeUI);
         });
         
         // Ensure correct state on load
         updateAudioModeUI();
         
         
         function init() {
           
           scene = new THREE.Scene();
           scene.background = new THREE.Color(0x00AACC);
         
           camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
           camera.position.set(0, 0, 1);
         
           renderer = new THREE.WebGLRenderer({ antialias: true });
           renderer.setSize(document.getElementById('viewer').clientWidth, window.innerHeight);
           document.getElementById('viewer').appendChild(renderer.domElement);
         
           controls = new OrbitControls(camera, renderer.domElement);
           controls.target.set(0, 0, 0);
           controls.update();
         
           scene.add(new THREE.HemisphereLight(0xffffff, 0x000000, 1.2));         
           const loader = new GLTFLoader();
           loader.load(MODEL_URL, (gltf) => {
             const model = gltf.scene;
             scene.add(model);
             model.position.set(0, -0.5, 0);
         
             gltf.scene.traverse((child) => {
               if ((child.isMesh || child.isSkinnedMesh) && child.morphTargetDictionary) {
                 meshesWithMorphs.push(child);
                 console.log(`Found mesh with morphs: ${child.name}`);
               }
             });
         
             if (meshesWithMorphs.length === 0) {
               console.error('No morph-capable meshes found.');
               return;
             }
         
             const allVisemes = new Set();
             meshesWithMorphs.forEach(mesh => {
               Object.keys(mesh.morphTargetDictionary).forEach(name => allVisemes.add(name));
             });
         
             visemeNames = Array.from(allVisemes);
             console.log('Viseme names:', visemeNames);
         
             setInterval(cycleViseme, VIS_DURATION);
           },
           undefined,
           (err) => console.error('Model load error:', err));
         
           window.addEventListener('resize', () => {
             camera.aspect = document.getElementById('viewer').clientWidth / window.innerHeight;
             camera.updateProjectionMatrix();
             renderer.setSize(document.getElementById('viewer').clientWidth, window.innerHeight);
           });
         }
         
         function animate() {
           requestAnimationFrame(animate);
           controls.update();
           renderer.render(scene, camera);
         }
         
         window.submitText = async function () {
         const mode = getAudioMode();
         const resultBox = document.getElementById('resultOutput');
         resultBox.value = '';
         
         // WAV MODE
         if (mode === 'wav') {
         const fileInput = document.getElementById('wavInput');
         const file = fileInput.files[0];
         
         if (!file) {
         alert('Roghnaigh comhad WAV.');
         return;
         }
         
         resultBox.value = 'Ag próiseáil WAV...';
         
         const audioEl = document.getElementById('ttsAudio');
         audioEl.src = URL.createObjectURL(file);
         audioEl.load();
         
         audioEl.oncanplay = async () => {
         audioEl.play();
         
         // OPTIONAL:
         // If you later generate visemes from Rhubarb server-side,
         // fetch them here and call playVisemes(...)
         //
         // For now, this assumes viseme timing is already available
         // or will be added later.
         };
         
         return;
         }
         
         // ---------- TTS MODE (existing flow) ----------
         const text = document.getElementById('sentenceInput').value.trim();
         
         if (!text) {
         alert('Cuir isteach abairt ar dtús.');
         return;
         }
         
         resultBox.value = 'Ag seoladh...';
         
         try {
         const response = await fetch('http://127.0.0.1:5000/timing', {
         method: 'POST',
         headers: { 'Content-Type': 'application/json' },
         body: JSON.stringify({ text })
         });
         
         if (!response.ok) throw new Error(`HTTP ${response.status}`);
         
         const data = await response.json();
         const phonemes = parsePhonemeTiming(data);
         
         if (phonemes.length === 0) {
         resultBox.value = 'Gan toradh ó Abair.';
         return;
         }
         
         resultBox.value = phonemes
         .map(p => `${p.symbol} → ${p.viseme} @ ${p.end.toFixed(2)}s`)
         .join('\n');
         
         const audioEl = document.getElementById('ttsAudio');
         audioEl.src = data.audioUrl;
         audioEl.load();
         
         audioEl.oncanplay = () => {
         audioEl.play();
         playVisemes(phonemes);
         };
         
         } catch (err) {
         console.error(err);
         resultBox.value = `Earráid: ${err.message}`;
         }
         };
         
         
         function parsePhonemeTiming(data) {
             const phonemeToViseme = {
             'sil': 'viseme_sil',
         
             'b': 'viseme_PP',
             'bj': 'viseme_PP',
             'p_j': 'viseme_PP',
             'p': 'viseme_PP',
             'mj': 'viseme_PP',
             'm_d': 'viseme_PP',
             'm': 'viseme_PP',
         
             'f': 'viseme_FF',
             'fj': 'viseme_FF',
             'v': 'viseme_FF',
             'vj': 'viseme_FF',
         
             'dj': 'viseme_DD',
             'd': 'viseme_DD',
             't': 'viseme_DD',
             'tj': 'viseme_DD',
         
             'gj': 'viseme_kk',
             'g': 'viseme_kk',
             'k': 'viseme_kk',
             'kj': 'viseme_kk',
             'cj': 'viseme_kk',
         
             'djzj': 'viseme_CH',
             'sj': 'viseme_CH',
         
             'zj': 'viseme_SS',
             'z': 'viseme_SS',
             's': 'viseme_SS',
             
             'l': 'viseme_NN',
             'llj': 'viseme_NN',
             'll': 'viseme_NN',
             'lj_d': 'viseme_NN',
             'll_d': 'viseme_NN',
             'lj': 'viseme_NN',
             'ngj': 'viseme_NN',
             'nn': 'viseme_NN',
             'nnj': 'viseme_NN',
             'n': 'viseme_NN',
             'nj': 'viseme_NN',
             'nn_d': 'viseme_NN',
             'nj_d': 'viseme_NN',
             'ng': 'viseme_NN',
             'llj_d': 'viseme_NN',
         
             'r_d': 'viseme_RR',
             'rj_d': 'viseme_RR',
             'rj': 'viseme_RR',
             'r': 'viseme_RR',
             'gfj': 'viseme_RR',
         
             'a': 'viseme_aa',
             'ea': 'viseme_aa',
             'aa': 'viseme_aa',
             'ai': 'viseme_aa',
             'au': 'viseme_aa',
         
             '@': 'viseme_E',
             'e': 'viseme_E',
             'ee': 'viseme_E',
             'ei': 'viseme_E',
         
             'gf': 'viseme_I',
             'x': 'viseme_I',
             'xj': 'viseme_I',
             'i': 'viseme_I',
             'ii': 'viseme_I',
             'i@': 'viseme_I',
         
             'h': 'viseme_O',
             'oo': 'viseme_O',
             'o': 'viseme_O',
         
             'u': 'viseme_U',
             'u@': 'viseme_U',
             'uu': 'viseme_U',
           };
         
           const result = [];
           for (const word of data.timing || []) {
             for (const phone of word.phones || []) {
               const symbol = phone.symbol;
               result.push({
                 symbol,
                 end: phone.end,
                 viseme: phonemeToViseme[symbol] || 'mouthOpen'
               });
             }
           }
           return result;
         }
         
         function playVisemes(phonemes) {
         if (phonemes.length === 0) return;
         
         const VIS_OFFSET = -0.075; // Viseme lead in seconds
         const MAX_BLEND_DURATION = 0.15; // Cap interpolation duration
         
         let startTime = performance.now();
         let currentIndex = 0;
         
         function update() {
         const now = performance.now();
         const elapsed = (now - startTime) / 1000; // seconds
         
         // Find which phoneme should be active
         while (
         currentIndex < phonemes.length - 1 &&
         (phonemes[currentIndex + 1].end + VIS_OFFSET) < elapsed
         ) {
         currentIndex++;
         }
         
         const current = phonemes[currentIndex];
         const next = phonemes[currentIndex + 1];
         
         let t = 0;
         
         if (next) {
         const visemeStart = current.end + VIS_OFFSET;
         const actualDuration = next.end - current.end;
         const blendDuration = Math.min(actualDuration, MAX_BLEND_DURATION);
         const timeIntoBlend = elapsed - visemeStart;
         t = timeIntoBlend / blendDuration;
         t = THREE.MathUtils.clamp(t, 0, 1);
         }
         
         // Reset all influences
         meshesWithMorphs.forEach(mesh => {
         const inf = mesh.morphTargetInfluences;
         if (!inf) return;
         for (let i = 0; i < inf.length; i++) inf[i] = 0;
         
         const currentIdx = mesh.morphTargetDictionary[current.viseme];
         if (currentIdx !== undefined) inf[currentIdx] = 1 - t;
         
         if (next) {
         const nextIdx = mesh.morphTargetDictionary[next.viseme];
         if (nextIdx !== undefined) inf[nextIdx] = t;
         }
         });
         
         if (currentIndex < phonemes.length - 1) {
         requestAnimationFrame(update);
         }
         }
         
         requestAnimationFrame(update);
         }
                
         
      </script>
   </body>
</html>
