<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <title>Avatar Viseme UI</title>
      <link rel="stylesheet" href="css/styles.css" />
      <script type="importmap">
         {
           "imports": {
             "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
             "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
           }
         }
      </script>
   </head>
   <body>
      <div id="viewer"></div>
      <div id="ui">
         <label style="margin-bottom: 5px;">
         <input type="radio" name="audioMode" value="tts" checked />
         Synthesised Audio
         </label>
         <label style="margin-bottom: 10px;">
         <input type="radio" name="audioMode" value="wav" />
         Upload WAV
         </label>
         <!-- WAV MODE -->
         <div id="wavInputs" style="display: none;">
            <input
               type="file"
               id="wavInput"
               accept=".wav"
               style="width: 90%; margin-bottom: 10px;"
               />
         </div>
         <!-- TTS MODE -->
         <div id="ttsInputs">
            <h2>Cuir isteach abairt as Gaeilge</h2>
            <textarea
               id="sentenceInput"
               placeholder="Scríobh do abairt anseo...">
            </textarea>
         </div>
         <button onclick="submitText()">Seol</button>
         <borderthing></borderthing>
         <textarea
            id="resultOutput"
            readonly
            placeholder="transcription will appear here...">
         </textarea>
         <audio
            id="ttsAudio"
            controls
            style="width: 100%; margin-top: 10px;">
         </audio>
      </div>
      <script type="module" src="js/main.js"></script>
   </body>
</html>
